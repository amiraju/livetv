<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --panel: #0f1318;
    --card: #141920;
    --border: #1e2730;
    --accent: #00d4ff;
    --accent2: #ff4d6d;
    --green: #00ff9d;
    --text: #c8d8e8;
    --muted: #4a5a6a;
    --sidebar-w: 260px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* SIDEBAR */
  #sidebar {
    width: var(--sidebar-w);
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  #sidebar-header {
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--border);
  }

  #sidebar-header h1 {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
  }

  #sidebar-header p {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 1px;
  }

  #search-wrap {
    padding: 12px 12px 8px;
    border-bottom: 1px solid var(--border);
  }

  #search {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 1px;
    outline: none;
    border-radius: 2px;
    transition: border-color 0.2s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--muted); }

  #group-tabs {
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    flex: 1;
  }

  .group-tab {
    padding: 9px 16px;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .group-tab:hover { color: var(--text); background: var(--card); }
  .group-tab.active { color: var(--accent); border-left-color: var(--accent); background: rgba(0,212,255,0.05); }

  .group-tab .count {
    margin-left: auto;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    background: var(--card);
    padding: 1px 5px;
    border-radius: 2px;
  }
  .group-tab.active .count { color: var(--accent); }

  /* MAIN */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* PLAYER */
  #player-section {
    background: #000;
    border-bottom: 1px solid var(--border);
    position: relative;
    height: 42vh;
    flex-shrink: 0;
  }

  #video-container {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #video-container video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
  }

  #placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    height: 100%;
    color: var(--muted);
  }

  #placeholder svg { opacity: 0.2; }

  #placeholder p {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 2px;
  }

  #now-playing-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    padding: 10px 14px 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #live-badge {
    background: var(--accent2);
    color: #fff;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 2px 6px;
    display: none;
  }

  #now-playing-name {
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
  }

  #now-playing-url {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    margin-left: auto;
    max-width: 300px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* CHANNEL GRID */
  #channel-area {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
  }

  #group-title-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  #group-title-bar h2 {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
  }

  #group-title-bar .line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  #channel-count {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
  }

  #channels {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
  }

  .ch-card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 12px 10px;
    cursor: pointer;
    transition: all 0.15s;
    border-radius: 2px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    overflow: hidden;
  }

  .ch-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 2px; height: 100%;
    background: var(--accent);
    transform: scaleY(0);
    transition: transform 0.2s;
    transform-origin: bottom;
  }

  .ch-card:hover { border-color: var(--accent); background: rgba(0,212,255,0.04); }
  .ch-card:hover::before { transform: scaleY(1); }
  .ch-card.active { border-color: var(--accent); background: rgba(0,212,255,0.08); }
  .ch-card.active::before { transform: scaleY(1); background: var(--green); }

  .ch-icon {
    width: 32px; height: 32px;
    background: var(--border);
    border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }

  .ch-name {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--text);
    line-height: 1.2;
    word-break: break-word;
  }

  .ch-group {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.58rem;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .ch-local-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.55rem;
    color: var(--green);
    letter-spacing: 1px;
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* STATUS BAR */
  #status-bar {
    padding: 5px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--panel);
    flex-shrink: 0;
  }

  .stat {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .stat span { color: var(--accent); }

  #dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    margin-left: auto;
  }
  #dot.live { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); animation: pulse 1.5s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* MOBILE */
  @media (max-width: 650px) {
    #sidebar { width: 200px; }
    #channels { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
    #player-section { height: 35vw; min-height: 160px; }
  }
</style>
</head>

<div id="sidebar">

  </div>

</div>

<div id="main">

        </svg>
        <p>SELECT A CHANNEL TO WATCH</p>
      </div>
      <video id="player" controls></video>
    </div>
    <div id="now-playing-bar">
      <span id="live-badge">&#11044; LIVE</span>
      <span id="now-playing-name">--</span>
      <span id="now-playing-url"></span>
    </div>
  </div>

  <div id="channel-area">
    <div id="group-title-bar">
      <h2 id="group-label">All Channels</h2>
      <div class="line"></div>
      <span id="channel-count" class="stat"></span>
    </div>
    <div id="channels"></div>
  </div>

  <div id="status-bar">

    <div class="stat" id="stream-status">STATUS: <span>IDLE</span></div>
    <div id="dot"></div>

</div>

const groups = ["All", ...new Set(CHANNELS.map(c => c.group))];
let activeGroup = "All";
let activeCard = null;
let hls = null;
let searchQ = "";

const video = document.getElementById("player");
const placeholder = document.getElementById("placeholder");
const nowName = document.getElementById("now-playing-name");
const nowUrl = document.getElementById("now-playing-url");
const liveBadge = document.getElementById("live-badge");
const dot = document.getElementById("dot");
const streamStatus = document.getElementById("stream-status");
const channelsEl = document.getElementById("channels");
const groupLabel = document.getElementById("group-label");
const channelCount = document.getElementById("channel-count");
const totalCount = document.getElementById("total-count");
const groupCount = document.getElementById("group-count");

// Build sidebar group tabs
const tabsEl = document.getElementById("group-tabs");
totalCount.textContent = CHANNELS.length;
groupCount.textContent = groups.length - 1;

function buildTabs() {
  tabsEl.innerHTML = "";
  groups.forEach(g => {
    const cnt = g === "All" ? CHANNELS.length : CHANNELS.filter(c => c.group === g).length;
    const tab = document.createElement("div");
    tab.className = "group-tab" + (g === activeGroup ? " active" : "");
    tab.innerHTML = `${g}<span class="count">${cnt}</span>`;
    tab.onclick = () => { activeGroup = g; buildTabs(); renderChannels(); };
    tabsEl.appendChild(tab);
  });
}

function getFiltered() {
  let list = activeGroup === "All" ? CHANNELS : CHANNELS.filter(c => c.group === activeGroup);
  if (searchQ) list = list.filter(c => c.name.toLowerCase().includes(searchQ) || c.group.toLowerCase().includes(searchQ));
  return list;
}

function renderChannels() {
  const list = getFiltered();
  groupLabel.textContent = activeGroup === "All" ? "All Channels" : activeGroup;
  channelCount.innerHTML = `<span>${list.length}</span> CH`;
  channelsEl.innerHTML = "";
  list.forEach(ch => {
    const card = document.createElement("div");
    card.className = "ch-card";
    if (activeCard && activeCard.url === ch.url && activeCard.name === ch.name) card.classList.add("active");
    card.innerHTML = `
      <div class="ch-icon">${ch.icon}</div>
      <div class="ch-name">${ch.name}</div>
      <div class="ch-group">${ch.group}</div>
      ${ch.local ? '<div class="ch-local-badge">◉ LAN</div>' : ''}
    `;
    card.onclick = () => playChannel(ch, card);
    channelsEl.appendChild(card);
  });
}

function playChannel(ch, card) {
  // Deactivate old
  document.querySelectorAll(".ch-card.active").forEach(c => c.classList.remove("active"));
  card.classList.add("active");
  activeCard = ch;

  nowName.textContent = ch.name;
  nowUrl.textContent = ch.url;
  liveBadge.style.display = "inline-block";
  placeholder.style.display = "none";
  video.style.display = "block";

  streamStatus.innerHTML = 'STATUS: <span style="color:var(--accent)">CONNECTING</span>';
  dot.className = "";

  if (hls) { hls.destroy(); hls = null; }

  if (Hls.isSupported()) {
    hls = new Hls({ enableWorker: true, lowLatencyMode: true });
    hls.loadSource(ch.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(() => {});
      streamStatus.innerHTML = 'STATUS: <span style="color:var(--green)">LIVE</span>';
      dot.className = "live";
    });
    hls.on(Hls.Events.ERROR, (e, data) => {
      if (data.fatal) {
        streamStatus.innerHTML = 'STATUS: <span style="color:var(--accent2)">ERROR</span>';
        dot.className = "";
      }
    });
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = ch.url;
    video.play().catch(() => {});
    streamStatus.innerHTML = 'STATUS: <span style="color:var(--green)">LIVE</span>';
    dot.className = "live";
  } else {
    streamStatus.innerHTML = 'STATUS: <span style="color:var(--accent2)">NO HLS SUPPORT</span>';
  }
}

document.getElementById("search").addEventListener("input", e => {
  searchQ = e.target.value.toLowerCase().trim();
  renderChannels();
});

buildTabs();
renderChannels();
